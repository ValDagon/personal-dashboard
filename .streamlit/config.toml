[theme]
# Streamlit chrome stays cyan; world colors (work pink, hobby cyan) live in CSS and Plotly.
base = "dark"
primaryColor = "#3EC4FF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#121A2C"
textColor = "#E8F1FF"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
